[python]
interpreter = "python3"

[tools]
disabled = []

[configs]
ruff = "config/ruff.example.toml"
pylint = ""
mypy = ""
flake8 = ""

exclude = ["**/node_modules/**", "**/.venv/**", "**/vendor/**", "**/generated/**"]

[[profiles]]
name = "legacy"
match = ["**/legacy/**"]
interpreter = "python3"
tools = ["flake8"]
