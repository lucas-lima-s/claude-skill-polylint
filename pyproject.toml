[project]
name = "polylint"
version = "0.1.0"
description = "Three-phase lint runner for Claude Code: pre-commit replay, parallel read-only analysis, approval-gated fixes."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Lucas de Lima" }]
dependencies = []

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "pre-commit",
    "pylint",
    "mypy",
    "vulture",
    "bandit",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.black]
line-length = 100

[tool.uv]
package = false
